<!-- ================= TRANSFER PAGE FORM START ================= -->
<section class="transfer-form-section">
    <div class="container">
        <h2 class="form-title">Airport Transfer</h2>
        <p class="form-subtitle">
            Fill in the details below. Your request will be sent via <strong>WhatsApp</strong> for a faster response.
        </p>

        <form id="transferForm">
            <!-- Two-column fields -->
            <div class="form-row">
                <div class="form-group">
                    <label>Your Name*</label>
                    <input type="text" id="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email*</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Phone*</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>
                <div class="form-group">
                    <label>Country*</label>
                    <input type="text" id="country" placeholder="Enter your country" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Adults*</label>
                    <input type="number" id="adults" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label>Children</label>
                    <input type="number" id="children" min="0" value="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Vehicle Type*</label>
                    <select id="vehicleType" required>
                        <option value="">Select Vehicle</option>
                        <option>Car</option>
                        <option>Van</option>
                        <option>Bus</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Luggage*</label>
                    <select id="luggage" required>
                        <option value="">Select Bag Size</option>
                        <option>Small</option>
                        <option>Medium</option>
                        <option>Large</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="pickup">
                    <label for="pickup">Pick Up</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="dropoff">
                    <label for="dropoff">Drop Off</label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group full-width">
                    <label>Additional Message</label>
                    <textarea id="message" placeholder="Any special request or note"></textarea>
                </div>
            </div>

            <div class="form-row buttons-row">
                <button type="button" id="sendBtn">Send via WhatsApp</button>
                <button type="reset" id="clearBtn">Clear Form</button>
            </div>

            <p id="formFeedback" class="feedback"></p>
        </form>

        <div class="back-home">
            <button onclick="window.location.href='CustomTours.html'">← Back to Home</button>
        </div>
    </div>
</section>

<style>
/* ================= STYLISH FORM UI ================= */
.transfer-form-section {
    max-width: 950px;
    margin: 50px auto;
    padding: 30px;
    background: linear-gradient(135deg, #fff8f0, #fef3e0);
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    font-family: 'Arial', sans-serif;
    animation: fadeInForm 1s ease;
}

/* Title & Subtitle */
.form-title {
    text-align: center;
    font-size: 36px;
    color: #ff6b6b;
    margin-bottom: 10px;
    animation: slideIn 0.8s ease forwards;
}
.form-subtitle {
    text-align: center;
    font-size: 16px;
    color: #555;
    margin-bottom: 35px;
    animation: slideIn 0.8s ease forwards;
    animation-delay: 0.2s;
}

/* Form Layout */
form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.form-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}
.form-group {
    flex: 1 1 45%;
    display: flex;
    flex-direction: column;
}
.form-group.full-width {
    flex: 1 1 100%;
}
label {
    margin-bottom: 5px;
    font-weight: bold;
    color: #333;
}
input, select, textarea {
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    width: 100%;
    transition: all 0.3s ease;
}
input:focus, select:focus, textarea:focus {
    border-color: #25D366;
    box-shadow: 0 0 12px rgba(37,211,102,0.25);
    outline: none;
}
textarea {
    resize: vertical;
    min-height: 90px;
}

/* Checkboxes */
.checkbox-group {
    flex: 1 1 45%;
    display: flex;
    align-items: center;
    gap: 10px;
}
.checkbox-group input {
    width: auto;
}

/* Buttons */
.buttons-row {
    display: flex;
    gap: 20px;
    justify-content: center;
}
#sendBtn, #clearBtn {
    padding: 14px 30px;
    font-weight: bold;
    font-size: 16px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}
#sendBtn {
    background: linear-gradient(45deg, #25D366, #1ebe57);
    color: #fff;
}
#sendBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 25px rgba(37,211,102,0.3);
}
#clearBtn {
    background: #ff6b6b;
    color: #fff;
}
#clearBtn:hover {
    transform: scale(1.08);
    box-shadow: 0 10px 25px rgba(255,107,107,0.3);
}

/* Feedback Message */
.feedback {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    color: #25D366;
    font-size: 15px;
    animation: fadeInFeedback 0.5s ease forwards;
}

/* Back to Home Button */
.back-home {
    text-align: center;
    margin-top: 30px;
}
.back-home button {
    background: #ff6b6b;
    color: #fff;
    padding: 12px 25px;
    font-weight: bold;
    font-size: 16px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
}
.back-home button:hover {
    background: #ff4747;
    transform: scale(1.05);
}

/* Animations */
@keyframes fadeInForm {
    from {opacity:0; transform: translateY(30px);}
    to {opacity:1; transform: translateY(0);}
}
@keyframes slideIn {
    from {opacity:0; transform: translateY(-20px);}
    to {opacity:1; transform: translateY(0);}
}
@keyframes fadeInFeedback {
    from {opacity:0;}
    to {opacity:1;}
}

/* Responsive */
@media (max-width: 768px) {
    .form-row {
        flex-direction: column;
    }
    .form-group {
        flex: 1 1 100%;
    }
    .checkbox-group {
        flex: 1 1 100%;
    }
}
</style>

<script>
// =================== WHATSAPP FORM SEND ===================
document.getElementById("sendBtn").addEventListener("click", function() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const country = document.getElementById("country").value.trim();
    const adults = document.getElementById("adults").value.trim();
    const children = document.getElementById("children").value.trim();
    const vehicle = document.getElementById("vehicleType").value;
    const luggage = document.getElementById("luggage").value;
    const pickup = document.getElementById("pickup").checked ? "Yes" : "No";
    const dropoff = document.getElementById("dropoff").checked ? "Yes" : "No";
    const message = document.getElementById("message").value.trim();

    // Validate required fields
    if(!name || !email || !phone || !country || !adults || !vehicle || !luggage){
        alert("Please fill all required fields marked with *.");
        return;
    }

    // Format WhatsApp message
    const whatsappMessage = 
`*Airport Transfer Request*%0A
*Name:* ${name}%0A
*Email:* ${email}%0A
*Phone:* ${phone}%0A
*Country:* ${country}%0A
*Adults:* ${adults}%0A
*Children:* ${children}%0A
*Vehicle Type:* ${vehicle}%0A
*Luggage:* ${luggage}%0A
*Pick Up:* ${pickup}%0A
*Drop Off:* ${dropoff}%0A
*Message:* ${message}`;

    // Open WhatsApp link
    const whatsappURL = `https://wa.me/94762055008?text=${whatsappMessage}`;
    window.open(whatsappURL, "_blank");

    // Show feedback message
    const feedback = document.getElementById("formFeedback");
    feedback.textContent = "✅ Your transfer request has been sent via WhatsApp!";
    setTimeout(()=> feedback.textContent="", 7000);
});

// Clear button
document.getElementById("clearBtn").addEventListener("click", function() {
    document.getElementById("formFeedback").textContent = "";
});
</script>
<!-- ================= TRANSFER PAGE FORM END ================= -->
