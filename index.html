<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ceylon Birdwing Tours — Coming Soon</title>
<style>
  :root {
    --forest-deep: #0f2818;
    --forest-mid: #1e4d2b;
    --leaf: #4a7c59;
    --gold: #d4a537;
    --cream: #f5f1e6;
    --sky: #a8c5b4;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    background: radial-gradient(circle at 20% 20%, var(--forest-mid), var(--forest-deep) 70%);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  .bg-pattern {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle, rgba(212,165,55,0.08) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 3rem 2.5rem;
    max-width: 640px;
    background: rgba(15, 40, 24, 0.55);
    border: 1px solid rgba(212, 165, 55, 0.35);
    border-radius: 14px;
    backdrop-filter: blur(4px);
    animation: fadeIn 1.2s ease-out;
  }

  h1 {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    letter-spacing: 1px;
    color: var(--gold);
    font-weight: 400;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--sky);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto 2rem;
    opacity: 0.7;
  }

  .message {
    font-size: 1.15rem;
    line-height: 1.7;
    color: var(--cream);
    margin-bottom: 1.5rem;
  }

  .status {
    display: inline-block;
    padding: 0.5rem 1.4rem;
    border: 1px solid var(--gold);
    border-radius: 30px;
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    margin-top: 0.5rem;
  }

  footer {
    position: relative;
    z-index: 2;
    position: absolute;
    bottom: 1.5rem;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: rgba(245, 241, 230, 0.5);
    letter-spacing: 1px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 480px) {
    .container {
      padding: 2.2rem 1.5rem;
    }
  }
</style>
</head>
<body>

  <div class="bg-pattern"></div>

  <div class="container">
    <h1>Ceylon Birdwing Tours</h1>
    <p class="subtitle">Sri Lanka</p>
    <div class="divider"></div>
    <span class="status">Site Under Development</span>
  </div>

  <footer>&copy; 2026 Ceylon Birdwing Tours. All rights reserved.</footer>

</body>
</html>
