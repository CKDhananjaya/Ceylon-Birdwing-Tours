<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airport Transfer Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= SLACK-INSPIRED DESIGN SYSTEM ================= */
:root {
    --primary-purple: #4A154B; /* The deep purple from the top bar */
    --hover-purple: #5d1b5e;
    --accent-teal: #2EB67D;    /* From the decorative circles */
    --accent-pink: #E01E5A;    /* From the decorative circles */
    --accent-blue: #36C5F0;    /* From the decorative circles */
    --text-dark: #1d1c1d;
    --text-gray: #616061;
    --border-light: #dddddd;
    --bg-light: #f4ede4;       /* Slight warm off-white/gray */
}

body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #fff;
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* The Top Purple Header Strip */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 380px; /* Deep header like the screenshot */
    background-color: var(--primary-purple);
    z-index: -1;
    clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%); /* Slight angle for modern feel */
}

/* Container - Floating Card Style */
.transfer-container {
    display: flex;
    max-width: 960px;
    width: 90%;
    margin: 80px auto;
    background: #ffffff;
    border-radius: 12px; /* Smoother rounding */
    box-shadow: 0 4px 40px rgba(0,0,0,0.15); /* Soft, deep shadow */
    overflow: hidden;
    position: relative;
}

/* Left Info Panel - Mimicking the "Graphic/Context" side */
.transfer-info {
    flex: 0 0 35%; /* Fixed width for info */
    background: #f8f8f8;
    padding: 50px 40px;
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    position: relative;
    border-right: 1px solid var(--border-light);
    overflow: hidden;
}

/* Decorative "Bubbles" to match the screenshot graphics */
.transfer-info::before {
    content: "";
    position: absolute;
    top: -30px;
    right: -30px;
    width: 120px;
    height: 120px;
    background: var(--accent-teal);
    border-radius: 50%;
    opacity: 0.2;
}
.transfer-info::after {
    content: "";
    position: absolute;
    bottom: 50px;
    left: -40px;
    width: 180px;
    height: 180px;
    background: var(--accent-pink);
    border-radius: 50%;
    opacity: 0.1;
}

.transfer-info h2 {
    font-size: 24px;
    margin-bottom: 20px;
    color: var(--primary-purple); /* Brand color heading */
    font-weight: 700;
    z-index: 1;
}

.transfer-info p {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-gray);
    margin-bottom: 30px;
    z-index: 1;
}

.contact-item {
    margin-top: 15px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--text-dark);
    font-weight: 500;
    z-index: 1;
    background: #fff;
    padding: 10px 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* Right Form Panel */
.transfer-form {
    flex: 1;
    padding: 50px 50px;
    background: #fff;
}

.transfer-form h2 {
    font-size: 22px;
    margin-bottom: 8px;
    color: var(--text-dark);
    font-weight: 700;
}

.transfer-form p {
    font-size: 14px;
    margin-bottom: 30px;
    color: var(--text-gray);
}

/* Form Layout */
form {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-row {
    display: flex;
    gap: 20px;
}

.form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.form-group.full-width {
    flex: 100%;
}

/* Inputs & Selects - Clean, Boxy, Light Border */
input, select, textarea {
    padding: 14px 16px;
    border-radius: 6px;
    border: 1px solid var(--border-light);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    width: 100%;
    box-sizing: border-box; /* Fix padding issues */
    transition: 0.2s;
    background: #fff;
    color: var(--text-dark);
}

input::placeholder, textarea::placeholder {
    color: #a0a0a0;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 4px rgba(54, 197, 240, 0.15); /* Blue focus ring like screenshot */
    outline: none;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

/* Checkboxes - Styled to look cleaner */
.checkbox-group {
    flex-direction: row;
    align-items: center;
    gap: 10px;
    background: #f9f9f9;
    padding: 10px 15px;
    border-radius: 6px;
    border: 1px solid transparent;
}
.checkbox-group:hover {
    border-color: var(--border-light);
}
.checkbox-group input {
    width: 18px;
    height: 18px;
    margin: 0;
    cursor: pointer;
    accent-color: var(--primary-purple);
}
.checkbox-group label {
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-dark);
}

/* Buttons */
.buttons-row {
    display: flex;
    gap: 15px;
    margin-top: 15px;
    flex-wrap: wrap;
}

button {
    padding: 14px 24px;
    font-weight: 700;
    font-size: 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
    letter-spacing: 0.5px;
    text-transform: uppercase;
}

/* Primary Button - Matches the "Send us a message" purple button */
#sendBtn {
    background: var(--primary-purple);
    color: #fff;
    border: 1px solid var(--primary-purple);
    flex: 2;
}

#sendBtn:hover {
    background: var(--hover-purple);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(74, 21, 75, 0.3);
}

/* Secondary Button - Matches the "Start a live chat" outline button */
#clearBtn {
    background: transparent;
    color: var(--primary-purple);
    border: 1px solid var(--border-light);
    flex: 1;
}

#clearBtn:hover {
    border-color: var(--primary-purple);
    background: rgba(74, 21, 75, 0.05);
}

/* Feedback */
.feedback {
    margin-top: 15px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-teal);
    text-align: center;
    min-height: 20px;
}

/* Back Home */
.back-home {
    margin-top: 30px;
    border-top: 1px solid var(--border-light);
    padding-top: 20px;
    text-align: center;
}

.back-home button {
    background: none;
    color: var(--text-gray);
    padding: 8px 16px;
    border: none;
    font-size: 13px;
    text-transform: none;
    font-weight: 500;
}

.back-home button:hover {
    color: var(--primary-purple);
    text-decoration: underline;
    background: none;
    box-shadow: none;
    transform: none;
}

/* ================= RESPONSIVE ================= */
@media (max-width: 900px){
    .transfer-container {
        flex-direction: column;
        margin: 20px auto;
        width: 95%;
    }
    
    body::before {
        height: 180px; /* Smaller header on mobile */
        clip-path: none;
    }
    
    .transfer-info {
        padding: 30px 25px;
        flex: auto;
        border-right: none;
        border-bottom: 1px solid var(--border-light);
    }
    
    .transfer-form {
        padding: 30px 20px;
    }

    .form-row {
        flex-direction: column;
        gap: 15px;
    }
    
    .buttons-row {
        flex-direction: column;
    }
    
    button {
        width: 100%;
    }
}
</style>
</head>
<body>

<div class="transfer-container">
    <div class="transfer-info">
        <h2>Support Team</h2>
        <p>Welcome! Fill in the form to request an airport transfer. Our team will respond quickly via WhatsApp.</p>
        <div class="contact-item">📞 +94 76 2055008</div>
        <div class="contact-item">✉️ ceylonbirdwingtours@gmail.com</div>
    </div>

    <div class="transfer-form">
        <h2>Send Us a Message</h2>
        <p>We are here for it all. Ask us anything about your transfer.</p>
        <form id="transferForm">
            <div class="form-row">
                <div class="form-group"><input type="text" id="name" placeholder="Your Name*" required></div>
                <div class="form-group"><input type="email" id="email" placeholder="Email*" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><input type="tel" id="phone" placeholder="Phone*" required></div>
                <div class="form-group"><input type="text" id="country" placeholder="Country*" required></div>
            </div>
            <div class="form-row">
                <div class="form-group"><input type="number" id="adults" placeholder="Adults*" min="1" value="1" required></div>
                <div class="form-group"><input type="number" id="children" placeholder="Children" min="0" value="0"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <select id="vehicleType" required>
                        <option value="">Vehicle Type*</option>
                        <option>Car</option>
                        <option>Van</option>
                        <option>Bus</option>
                    </select>
                </div>
                <div class="form-group">
                    <select id="luggage" required>
                        <option value="">Luggage*</option>
                        <option>Small</option>
                        <option>Medium</option>
                        <option>Large</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group checkbox-group"><input type="checkbox" id="pickup"><label for="pickup">Pick Up</label></div>
                <div class="form-group checkbox-group"><input type="checkbox" id="dropoff"><label for="dropoff">Drop Off</label></div>
            </div>
            <div class="form-row">
                <div class="form-group full-width"><textarea id="message" placeholder="Add any additional information we can use to help you..."></textarea></div>
            </div>
            <div class="buttons-row">
                <button type="button" id="sendBtn">Send via WhatsApp</button>
                <button type="reset" id="clearBtn">Clear</button>
            </div>
            <p class="feedback" id="formFeedback"></p>
        </form>

        <div class="back-home">
            <button onclick="window.location.href='CustomTours.html'">← Back to Home</button>
        </div>
    </div>
</div>

<script>
document.getElementById("sendBtn").addEventListener("click", function() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const country = document.getElementById("country").value.trim();
    const adults = document.getElementById("adults").value.trim();
    const children = document.getElementById("children").value.trim();
    const vehicle = document.getElementById("vehicleType").value;
    const luggage = document.getElementById("luggage").value;
    const pickup = document.getElementById("pickup").checked ? "Yes" : "No";
    const dropoff = document.getElementById("dropoff").checked ? "Yes" : "No";
    const message = document.getElementById("message").value.trim();

    if(!name || !email || !phone || !country || !adults || !vehicle || !luggage){
        alert("Please fill all required fields marked with *.");
        return;
    }

    const whatsappMessage = 
`*Airport Transfer Request*%0A
*Name:* ${name}%0A
*Email:* ${email}%0A
*Phone:* ${phone}%0A
*Country:* ${country}%0A
*Adults:* ${adults}%0A
*Children:* ${children}%0A
*Vehicle Type:* ${vehicle}%0A
*Luggage:* ${luggage}%0A
*Pick Up:* ${pickup}%0A
*Drop Off:* ${dropoff}%0A
*Message:* ${message}`;

    window.open(`https://wa.me/94762055008?text=${whatsappMessage}`, "_blank");
    const feedback = document.getElementById("formFeedback");
    feedback.textContent = "✅ Your transfer request has been sent via WhatsApp!";
    setTimeout(()=> feedback.textContent="", 7000);
});

document.getElementById("clearBtn").addEventListener("click", function() {
    document.getElementById("formFeedback").textContent = "";
});
</script>

</body>
</html>
